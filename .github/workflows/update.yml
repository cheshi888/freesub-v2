name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-24.04
    # ★ 2026-10-05: 钉死 24.04 —— GitHub 10-19 起把 ubuntu-latest 逐步切到 26.04,
    #   26.04 移除了部分预装工具, 自动迁移可能导致构建失败停更。
    #   另: timeout 50→120 —— 实测单轮 38~46 分钟, 50 分钟超时曾导致跑一半被杀
    #   ("罢工"式停更); 每 6 小时一轮, 120 分钟上限仍有充足余量。
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      # 必须在 main_v2.py 之后跑: 依赖它 step 里下载好的 runtime/sing-box 内核。
      # continue-on-error: 单元测试是"体检"而非"门禁" —— 它失败说明代码有问题需要看日志,
      # 但不该因此丢掉本轮已经跑完并且正常产出的订阅更新 (否则一次偶发抖动就会让订阅停更)。
      - name: Unit tests (解析器 / 家宽甄选)
        continue-on-error: true
        run: |
          python scripts/test_parsers.py
          python scripts/test_residential.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json residential-audit.txt; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
